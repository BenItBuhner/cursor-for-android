org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Version of the next release. Tagged builds override this from the tag (v0.2.0 -> 0.2.0); versionCode is derived from
# it in app/build.gradle.kts. Bump it after tagging so dev builds report the version they lead up to.
app.versionName=0.2.0
