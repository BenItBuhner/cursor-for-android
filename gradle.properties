# 4 GB for the Gradle daemon: lint's analyses and R8 run inside it, and both are memory-hungry on this module. The
# Kotlin compile daemon would inherit the same figure; it is given its own, smaller one below.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx3g -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Dependency downloads: give a repository six attempts (Gradle's default is three), starting 2 s apart and doubling, when
# it fails in a way that can pass - connection reset or timeout, 5xx, 408, 429. A 401/403 is final for Gradle and
# disables that repository for the build; the dependency cache is the defence there (see "Robolectric SDK jars" in
# app/build.gradle.kts). Internal Gradle settings, spelled as Gradle 8 reads them.
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=2000

# Version of the next release. Tagged builds override this from the tag (v0.2.0 -> 0.2.0); versionCode is derived from
# it in app/build.gradle.kts. Bump it after tagging so dev builds report the version they lead up to.
app.versionName=0.3.51

# GitHub repository (owner/name) whose releases the app checks for updates and installs. Forks: point at your own.
app.githubRepo=BenItBuhner/cursor-for-android
