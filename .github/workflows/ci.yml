name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One active run per branch; a newer push cancels the previous run. Pull request runs and the dispatched runs
# pr-commands.yml starts share the branch's group (head_ref for the one, ref_name for the other), so a dispatch on an
# old head does not keep running beside the PR's own run. Every main commit gets its own group and is never cancelled:
# release.yml's gate needs a green run on the commit it tags, and a cancelled run still held runners until its jobs
# drained.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-{0}', github.head_ref || github.ref_name) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail, so a failing command inside a pipeline fails the step

jobs:
  # A push to main whose tree a green run has already proved does not prove it again. After a merge of a pull request
  # that was up to date with main, the merge commit's tree is byte-identical to the pull request head's, and the head's
  # green run tested that very tree; release.yml's gate and scripts/release-cut.sh accept such a run as the evidence
  # for the merge commit for the same reason. Here that run lets the heavy jobs below skip: the push costs one short
  # job instead of eleven runners for a quarter of an hour, which at busy hours is where the queue comes from (twelve
  # jobs per push against the account's twenty). `ci` then reports success naming the proving run, and the one
  # unit-test job that still runs only warms the Gradle caches, which are written from main alone. A main commit whose
  # tree no green run has seen (main moved under the pull request, a squash that differs, a direct push) runs in full.
  proof:
    name: Proof
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # the runs of this workflow
    outputs:
      run: ${{ steps.find.outputs.run }}
      shards: ${{ steps.find.outputs.shards || '["1/6", "2/6", "3/6", "4/6", "5/6", "6/6"]' }}
    steps:
      - name: Find a green run on this tree
        id: find
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          commit="$(gh api "repos/$GH_REPO/commits/$SHA")"
          tree="$(jq -r .commit.tree.sha <<<"$commit")"
          echo "$SHA has tree $tree"
          # The commits whose runs could stand in: a merge commit's other parents (the merged pull request's head), and
          # the heads of the pull requests this commit belongs to (a squash or rebase merge has one parent).
          candidates="$( (jq -r '.parents[1:][].sha' <<<"$commit"; gh api "repos/$GH_REPO/commits/$SHA/pulls" --jq '.[].head.sha') | sort -u)"
          for c in $candidates; do
            [[ "$c" != "$SHA" ]] || continue
            if [[ "$(gh api "repos/$GH_REPO/commits/$c" --jq .commit.tree.sha)" != "$tree" ]]; then
              echo "${c::8}: a different tree"; continue
            fi
            run="$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$c&status=success&per_page=5" --jq '.workflow_runs[0].html_url // empty')"
            if [[ -z "$run" ]]; then echo "${c::8}: the identical tree, but no green run on it"; continue; fi
            echo "::notice title=Proved tree::${c::8} has the identical tree and the green run $run; the heavy jobs skip."
            echo "run=$run" >> "$GITHUB_OUTPUT"
            echo 'shards=["1/6"]' >> "$GITHUB_OUTPUT"
            exit 0
          done
          echo "No green run on this tree (candidates: ${candidates:-none}); everything runs."

  # Every job below checks out and compiles on its own runner; they run side by side, so the wall time of a run is
  # the slowest job, not the sum. The one status to require is `ci`, at the end.
  build:
    name: Build
    needs: proof
    if: needs.proof.outputs.run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true # the version is derived from the release tags (app/build.gradle.kts)

      - uses: ./.github/actions/android-toolchain

      # Dev builds report e.g. 0.1.0-dev.42+gabc1234 in Settings and the User-Agent so an installed build can be traced
      # back to this run and commit. The base version is the one git derives (app/build.gradle.kts): the release after the
      # highest tag; the stamp replaces its `-dev`.
      - name: Stamp dev version
        id: stamp
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          short_sha="${HEAD_SHA::7}"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "suffix=-dev.${GITHUB_RUN_NUMBER}+g${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug -Papp.versionNameSuffix="${{ steps.stamp.outputs.suffix }}"

      - name: Collect APK
        run: |
          version="$(./gradlew -q :app:printAppVersion -Papp.versionNameSuffix="${{ steps.stamp.outputs.suffix }}" | sed -n 's/^versionName=//p')"
          echo "Built version ${version}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/cursor-for-android-${version}-debug.apk"
          ls -l dist

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: apks-${{ steps.stamp.outputs.short_sha }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  # assembleRelease exercises R8 / resource shrinking on every change (lint's release-build pass is off, see `lint {}`
  # in app/build.gradle.kts; the `lint` job covers it). Its own runner: R8 alone takes two and a half minutes there,
  # and beside the debug build the two Kotlin compiles slowed each other down. The signing secrets are never passed to
  # this job, so -Papp.allowUnsignedRelease=true opts in to the debug key; without it a release build fails outright.
  # The APK it produces is for verification only - it pins no certificate and cannot be published.
  release-build:
    name: Release build (R8)
    needs: proof
    if: needs.proof.outputs.run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true # the version is derived from the release tags (app/build.gradle.kts)

      - uses: ./.github/actions/android-toolchain

      - name: Stamp dev version
        id: stamp
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          short_sha="${HEAD_SHA::7}"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "suffix=-dev.${GITHUB_RUN_NUMBER}+g${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Build release APK with R8
        run: ./gradlew :app:assembleRelease -Papp.allowUnsignedRelease=true -Papp.versionNameSuffix="${{ steps.stamp.outputs.suffix }}"

      - name: Collect APK
        run: |
          version="$(./gradlew -q :app:printAppVersion -Papp.allowUnsignedRelease=true -Papp.versionNameSuffix="${{ steps.stamp.outputs.suffix }}" | sed -n 's/^versionName=//p')"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/cursor-for-android-${version}-release-debugkey.apk"
          ls -l dist

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: apk-release-debugkey-${{ steps.stamp.outputs.short_sha }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  # Android lint over src/main and src/test (lintDebug: every check, not only the fatal ones). On its own runner: in
  # one job with the build it shared a 3 GB daemon with R8 and a second lint pass, and the three took ten minutes
  # between them where this alone takes under two.
  lint:
    name: Lint
    needs: proof
    if: needs.proof.outputs.run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true # the version is derived from the release tags (app/build.gradle.kts)

      - uses: ./.github/actions/android-toolchain

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # The ~4000 JVM unit tests over six runners, one test JVM each: six deterministic slices of the ordinary classes
  # (`-Papp.testShard=I/6`, balanced on app/test-class-seconds.properties). The benchmarks - the frame-time and
  # throughput claims (`*BenchmarkTest`, `TranscriptPerf*`) - are not among them: benchmarks.yml runs them alone on a
  # runner and reports without holding a merge or a release. One JVM because the runner's four vCPUs are two cores:
  # with two or three test JVMs side by side the fault and Compose UI tests, which assert on or wait for wall-clock
  # behaviour, timed out on one shard job in five; alone in their JVM they never have. The checks are named
  # "Unit tests (1/6)" .. "(6/6)"; `ci` below folds them, and every other job, into the one check to require. The
  # 25-minute limit is seven over the slowest job seen (18); a test JVM that stops making progress is killed long
  # before it, by the stall watchdog ("Test stalls" in app/build.gradle.kts), whose report - the stuck test, its last
  # output, a thread dump - is in the log and is the `unit-test-stalls-*` artifact.
  #
  # On a main push whose tree `proof` found a green run for, the matrix is the first shard alone, and it compiles
  # without testing: the Gradle caches (dependencies, the build cache the next runs' compiles restore from) are
  # written from main only, so a main push that ran nothing would leave them to age.
  unit-tests:
    name: Unit tests (${{ matrix.shard }})
    needs: proof
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.proof.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true # the version is derived from the release tags (app/build.gradle.kts)

      # The shards share one set of dependencies, so the first saves the Gradle caches for all six (on main; see the
      # action): one gradle-home entry and one build-cache bundle per push instead of six of each.
      - uses: ./.github/actions/android-toolchain
        with:
          cache-read-only: ${{ matrix.shard != '1/6' }}

      # The same compile the tests need, with the same stamp, so its outputs land in the build cache for the next runs.
      - name: Warm the Gradle caches (the tree is proved by ${{ needs.proof.outputs.run }})
        if: needs.proof.outputs.run != ''
        run: ./gradlew :app:compileDebugUnitTestKotlin -Papp.versionNameSuffix=-dev.1+gci

      # A stamp of the same shape as the build job's, so AppVersionTest's parity check runs against a resolved dev
      # version name and not just the base one: a versionCode derived from the base would pass unnoticed otherwise.
      # It is a constant, not the run's number and commit: the suffix is compiled into BuildConfig, which is an input
      # of compileDebugKotlin, so a per-run stamp made every run's compile a build-cache miss (100 s a shard, then
      # 60 s more for the test sources). With the constant, a run whose sources match the cache's restores the
      # compile instead. Nothing in the tests needs the real stamp; the APKs the build jobs upload still carry it.
      #
      # The Roborazzi walkthrough is covered by the `screenshots` job below.
      - name: Run JVM unit tests (${{ matrix.shard }})
        if: needs.proof.outputs.run == ''
        run: >
          ./gradlew :app:testDebugUnitTest -Papp.skipScreenshotTests=true -Papp.testShard=${{ matrix.shard }}
          -Papp.testForks=1 -Papp.versionNameSuffix=-dev.1+gci

      # Named for the shard ("1-of-6" .. "6-of-6"): an artifact name cannot hold the slash.
      - name: Name the artifacts
        if: always()
        id: artifacts
        env:
          SHARD: ${{ matrix.shard }}
        run: echo "suffix=${SHARD//\//-of-}" >> "$GITHUB_OUTPUT"

      # The JUnit XML always (a megabyte): the per-class times are what the slices are balanced on, and a failure's
      # message is in it. The HTML report only when something failed.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-tests-results-${{ steps.artifacts.outputs.suffix }}
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report-${{ steps.artifacts.outputs.suffix }}
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload test stall reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-stalls-${{ steps.artifacts.outputs.suffix }}
          path: app/build/reports/test-stalls/
          if-no-files-found: ignore

  screenshots:
    name: Screenshot tests
    needs: proof
    if: needs.proof.outputs.run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true # the version is derived from the release tags (app/build.gradle.kts)

      - uses: ./.github/actions/android-toolchain

      # Renders the demo walkthrough and the home-screen widget through Robolectric and compares them pixel-for-pixel
      # with screenshots/. When the UI changes on purpose, run the "Update screenshots" workflow (or
      # `./gradlew :app:recordRoborazziDebug`) and commit the result.
      #
      # Robolectric's android-all jars are Gradle dependencies served from the Gradle cache restored above ("Robolectric
      # SDK jars" in app/build.gradle.kts), and the tests run with robolectric.offline=true. Maven Central trouble
      # therefore shows up as a Gradle "Could not resolve org.robolectric:android-all-instrumented" failure while the task
      # graph is being built - never as every test class failing in classMethod, which is a real regression.
      - name: Verify screenshots against screenshots/
        run: ./gradlew :app:verifyRoborazziDebug --tests '*ScreenshotTest*'

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs
          path: |
            screenshots/*_compare.png
            screenshots/*_actual.png
            app/build/outputs/roborazzi/
            app/build/reports/roborazzi/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/test-stalls/
          if-no-files-found: ignore

  # The one status to require in branch protection: "CI". It succeeds only when every job above did, so the set of
  # jobs (and the number of unit-test shards) can change without touching the protection rule. `!cancelled()` makes it
  # run after failures too (without it a failed dependency would leave it skipped), but not in a cancelled run, where
  # `always()` kept it queued for a runner that the superseding run was waiting on. A job that was skipped counts as
  # a failure, so a job that never ran can never pass the run; the one exception is the main push whose tree `proof`
  # found a green run for, where the skipped jobs are the point and the proving run is named.
  ci:
    name: CI
    if: ${{ !cancelled() }}
    needs: [proof, build, release-build, lint, unit-tests, screenshots]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every job's result
        env:
          RESULTS: ${{ toJSON(needs) }}
          PROOF: ${{ needs.proof.outputs.run }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
          failed="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key' <<<"$RESULTS" | paste -sd' ')"
          skipped="$(jq -r 'to_entries[] | select(.value.result == "skipped") | .key' <<<"$RESULTS" | paste -sd' ')"
          if [[ -n "$failed" ]]; then
            echo "::error::Not every job succeeded: $failed"
            exit 1
          fi
          if [[ -n "$skipped" && -z "$PROOF" ]]; then
            echo "::error::Jobs were skipped with no green run on this tree to stand in for them: $skipped"
            exit 1
          fi
          if [[ -n "$PROOF" ]]; then
            echo "::notice title=Proved tree::This tree was proved by $PROOF; skipped here: $skipped."
          fi
