name: Release

# Pushing a tag such as v0.2.0 (or v0.2.0-rc.1 for a pre-release) builds a signed release APK + AAB from that tag and
# publishes them as a GitHub Release with auto-generated notes. The version comes from the tag alone:
#   versionName = tag without the leading "v", versionCode derived in app/build.gradle.kts.
#
# The tag's tree has to be one CI already proved: the `gate` job finds the green ci.yml run on the tagged commit (or
# on a pull-request head with the identical tree), waits for one that is still running, and only when there is none
# does the release job run lint and the unit tests itself. Releases are cut several times a day; the tests are not
# run twice on the same code.
#
# Signing uses these repository secrets (create them with scripts/release-keystore.sh):
#   RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
# All four are required to publish: a runner without them would sign with a throwaway debug key, which no later
# release can reproduce, so anyone who installed it could never be updated in place again. Without them the gate
# stops the run at once with a notice - the release is then cut by scripts/release-cut.sh, which signs with the key it
# is given, verifies the same way and publishes the same release; when it already has, this workflow (started by the
# tag that publishing created) finds the finished release and stands down. The build bakes its keystore's certificate
# into BuildConfig.RELEASE_CERT_SHA256 - the only signer the shipped updater will accept a later APK from - and this
# workflow refuses to publish an APK signed with anything else. Optionally also pin the expected signer with the
# RELEASE_CERT_SHA256 repository variable (or secret) to catch a swapped keystore secret.
#
# Crash reports (opt-in in the app; crash/CrashReporting.kt) are optional here too. With the SENTRY_DSN secret set,
# the build bakes that project in and the app's Settings offer the toggle; without it the build carries no crash
# reporting at all and says so. With SENTRY_AUTH_TOKEN (an organization auth token with project:releases) plus the
# SENTRY_ORG and SENTRY_PROJECT variables (or secrets), the build's R8 mapping is uploaded under a fresh UUID the
# app sends with each report, so an obfuscated trace can be read back. The mapping is attached to the release either
# way; only the upload needs the token.
#
# "Run workflow" (workflow_dispatch) rebuilds an existing tag, e.g. after adding the signing secrets; tick "dry run"
# to only attach the artifacts to the workflow run. A dry run is the only case where debug signing is allowed, and
# it never touches the GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v0.2.0
        required: true
        type: string
      dry_run:
        description: Dry run - build and upload artifacts to this run only, do not create or update the GitHub Release
        type: boolean
        default: false

permissions:
  contents: write # create the release and upload its assets
  actions: read # read ci.yml's runs for the evidence that the tree is proved

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash # -eo pipefail, so a failing command inside a pipeline fails the step

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # Only used by Gradle when RELEASE_KEYSTORE_FILE is set (see the "Prepare signing" step).
  RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
  RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
  RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

jobs:
  # Everything that can be known without a checkout, in seconds: is the tag well-formed, is the release already
  # published, can this run sign at all, and which CI run proved the tree.
  gate:
    name: Gate ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      sha: ${{ steps.commit.outputs.sha }}
      ci_proof: ${{ steps.ci.outputs.proof }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate tag
        id: tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' must look like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          version="${TAG#v}"
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version} (pre-release: ${prerelease})"

      - name: Resolve the tagged commit
        id: commit
        run: |
          object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object')"
          sha="$(jq -r '.sha' <<< "$object")"
          if [[ "$(jq -r '.type' <<< "$object")" == "tag" ]]; then
            sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.object.sha')"
          fi
          tree="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" --jq '.commit.tree.sha')"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "tree=${tree}" >> "$GITHUB_OUTPUT"
          echo "$TAG is commit ${sha} (tree ${tree})"

      # A finished release with its APK means scripts/release-cut.sh has already done this; the tag that started this
      # run is the one publishing created.
      - name: Is the release already published?
        id: published
        run: |
          if assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets --jq 'select(.isDraft == false) | .assets[].name' 2>/dev/null)" \
             && grep -q '\.apk$' <<< "$assets"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is already published with its APK; nothing to do."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Every secret is required, not just the keystore: a partially configured signing config would fall back to the
      # debug key just as silently. Without them this run cannot produce a publishable APK, so it stops here (a dry
      # run goes on, debug-signed).
      - name: Can this run sign?
        id: secrets
        env:
          HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          missing=()
          [[ "$HAS_KEYSTORE" == "true" ]] || missing+=(RELEASE_KEYSTORE_BASE64)
          for name in RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "::warning::${missing[*]} not set; this dry run's artifacts will be signed with the debug key and cannot be published."
            else
              echo "::notice::${missing[*]} not set, so this run cannot publish $TAG. Releases are cut with scripts/release-cut.sh (which signs with the key it is given) until the secrets exist; run scripts/release-keystore.sh --set-secrets to let this workflow publish."
            fi
          fi

      - name: Decide
        id: decide
        env:
          PUBLISHED: ${{ steps.published.outputs.published }}
          CONFIGURED: ${{ steps.secrets.outputs.configured }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$PUBLISHED" == "true" || ( "$CONFIGURED" != "true" && "$DRY_RUN" != "true" ) ]]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing for this run to build."
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      # The evidence: a successful ci.yml run on this commit, or on another commit with the identical tree (a pull
      # request's head after an up-to-date merge). A run still going on this commit is waited for. `proof` is the
      # run's URL, or `none`, in which case the release job runs lint and the unit tests itself.
      - name: Find the CI run that proved this tree
        id: ci
        if: steps.decide.outputs.proceed == 'true'
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          TREE: ${{ steps.commit.outputs.tree }}
        run: |
          runs() { gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?$1" --jq '.workflow_runs[] | [.id, .status, (.conclusion // ""), .head_sha, .html_url] | @tsv'; }
          proof=""
          pending=""
          while IFS=$'\t' read -r id status conclusion head url; do
            [[ -n "$id" ]] || continue
            if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then proof="$url"; break; fi
            [[ "$status" == "completed" ]] || pending="$id"
          done < <(runs "head_sha=$SHA&per_page=20")
          if [[ -z "$proof" ]]; then
            while IFS=$'\t' read -r id status conclusion head url; do
              [[ -n "$head" && "$head" != "$SHA" ]] || continue
              tree="$(gh api "repos/$GITHUB_REPOSITORY/commits/$head" --jq '.commit.tree.sha' 2>/dev/null || true)"
              if [[ "$tree" == "$TREE" ]]; then proof="$url"; echo "Commit ${head:0:7} has the identical tree."; break; fi
            done < <(runs "status=success&per_page=60")
          fi
          if [[ -z "$proof" && -n "$pending" ]]; then
            echo "CI run $pending is still running on $SHA; waiting for it."
            deadline=$(( $(date +%s) + 25 * 60 ))
            while :; do
              IFS=$'\t' read -r status conclusion url < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$pending" --jq '[.status, (.conclusion // ""), .html_url] | @tsv')
              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" == "success" ]]; then proof="$url"; else echo "::error::CI run $url ended with '$conclusion'; $TAG is not released."; exit 1; fi
                break
              fi
              (( $(date +%s) < deadline )) || { echo "::error::CI run $url is still '$status' after 25 minutes."; exit 1; }
              sleep 20
            done
          fi
          if [[ -n "$proof" ]]; then
            echo "proof=${proof}" >> "$GITHUB_OUTPUT"
            echo "Proved by $proof"
          else
            echo "proof=none" >> "$GITHUB_OUTPUT"
            echo "::warning::No CI run has proved this tree; the release job runs lint and the unit tests itself."
          fi

  release:
    name: Release ${{ inputs.tag || github.ref_name }}
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: ./.github/actions/android-toolchain

      # Only when no CI run proved this tree. The tag's version is passed here too, so AppVersionTest's parity check
      # covers the version being released.
      - name: Lint and unit tests (no CI run has proved this tree)
        if: needs.gate.outputs.ci_proof == 'none'
        run: >
          ./gradlew :app:lintDebug :app:testDebugUnitTest -Papp.skipScreenshotTests=true
          -Papp.versionName="${{ needs.gate.outputs.version }}"

      # The gate has already established that every secret is present unless this is a dry run.
      - name: Prepare signing
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$RELEASE_KEYSTORE_BASE64" && -n "$RELEASE_KEYSTORE_PASSWORD" && -n "$RELEASE_KEY_ALIAS" && -n "$RELEASE_KEY_PASSWORD" ]]; then
            keystore="$RUNNER_TEMP/release.jks"
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            [[ -s "$keystore" ]] || { echo "::error::RELEASE_KEYSTORE_BASE64 did not decode into a keystore."; exit 1; }
            echo "RELEASE_KEYSTORE_FILE=${keystore}" >> "$GITHUB_ENV"
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Signing with the release keystore."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Dry run without the signing secrets: debug key."
          fi

      # Optional, and absent by default: without SENTRY_DSN the app is built with no crash reporting and its Settings
      # say so. The mapping id is minted here so the build and the upload below agree on it.
      - name: Prepare crash reporting
        id: crash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || secrets.SENTRY_PROJECT }}
        run: |
          if [[ -z "$SENTRY_DSN" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SENTRY_DSN not set; this build has no crash reporting."
            exit 0
          fi
          # The DSN itself stays in the secrets context (an output holding a secret is dropped by the runner); the
          # build step reads it from there and only the mapping id travels as an output.
          uuid="$(uuidgen | tr 'A-Z' 'a-z')"
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "uuid=${uuid}" >> "$GITHUB_OUTPUT"
          missing=()
          for name in SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
            echo "Crash reports go to the configured Sentry project; the R8 mapping will be uploaded as ${uuid}."
          else
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${missing[*]} not set; the R8 mapping will not be uploaded to Sentry, so this build's crash reports will arrive obfuscated. It is still attached to the release."
          fi

      # An unsigned release build fails by default (app/build.gradle.kts). Only the dry run, which the gate lets
      # through without secrets and which never publishes, opts in to the debug key.
      - name: Build release APK and AAB
        env:
          UNSIGNED: ${{ steps.signing.outputs.configured != 'true' && '-Papp.allowUnsignedRelease=true' || '' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          MAPPING_UUID: ${{ steps.crash.outputs.uuid }}
        run: |
          crash=()
          [[ -z "$SENTRY_DSN" ]] || crash=(-Papp.sentryDsn="$SENTRY_DSN" -Papp.sentryProguardUuid="$MAPPING_UUID")
          ./gradlew :app:assembleRelease :app:bundleRelease -Papp.versionName="${{ needs.gate.outputs.version }}" $UNSIGNED "${crash[@]}"

      - name: Package artifacts
        id: package
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          UNSIGNED: ${{ steps.signing.outputs.configured != 'true' && '-Papp.allowUnsignedRelease=true' || '' }}
        run: |
          ./gradlew -q :app:printAppVersion -Papp.versionName="$VERSION" $UNSIGNED > "$RUNNER_TEMP/version.txt"
          version_code="$(sed -n 's/^versionCode=//p' "$RUNNER_TEMP/version.txt")"
          [[ -n "$version_code" ]] || { echo "::error::Could not resolve versionCode"; exit 1; }
          # The certificate the build baked into BuildConfig.RELEASE_CERT_SHA256 - the only one the shipped updater
          # will accept a future APK signed with. Empty in a dry run that had no keystore.
          pinned_cert="$(sed -n 's/^releaseCertSha256=//p' "$RUNNER_TEMP/version.txt")"

          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/cursor-for-android-${VERSION}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/cursor-for-android-${VERSION}.aab"
          cp app/build/outputs/mapping/release/mapping.txt "dist/cursor-for-android-${VERSION}-mapping.txt"
          (cd dist && sha256sum -- *.apk *.aab > SHA256SUMS.txt)

          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$apksigner" verify --verbose --print-certs "dist/cursor-for-android-${VERSION}.apk" | tee "$RUNNER_TEMP/apksigner.txt"
          cert_sha256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt")"

          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=${cert_sha256}" >> "$GITHUB_OUTPUT"
          echo "pinned_cert=${pinned_cert}" >> "$GITHUB_OUTPUT"
          ls -l dist

      # Under the same UUID the build baked in (BuildConfig.SENTRY_PROGUARD_UUID), so Sentry can pick this mapping for
      # this build's reports. sentry-cli is fetched by Sentry's installer, pinned, into the runner's temp dir.
      - name: Upload the R8 mapping to Sentry
        if: ${{ steps.crash.outputs.upload == 'true' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || secrets.SENTRY_PROJECT }}
          SENTRY_CLI_VERSION: "3.7.0"
          MAPPING_UUID: ${{ steps.crash.outputs.uuid }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sL https://sentry.io/get-cli/ | INSTALL_DIR="$RUNNER_TEMP/bin" sh
          "$RUNNER_TEMP/bin/sentry-cli" --version
          "$RUNNER_TEMP/bin/sentry-cli" upload-proguard --uuid "$MAPPING_UUID" --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" \
            "dist/cursor-for-android-${VERSION}-mapping.txt"
          echo "Uploaded the R8 mapping for ${VERSION} as ${MAPPING_UUID}."

      - name: Write release notes header
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          VERSION_CODE: ${{ steps.package.outputs.version_code }}
          CERT_SHA256: ${{ steps.package.outputs.cert_sha256 }}
          SIGNED: ${{ steps.signing.outputs.configured }}
          CRASH_REPORTS: ${{ steps.crash.outputs.configured }}
          MAPPING_UUID: ${{ steps.crash.outputs.uuid }}
          CI_PROOF: ${{ needs.gate.outputs.ci_proof }}
        run: |
          commit="$(git rev-parse HEAD)" # not GITHUB_SHA: on workflow_dispatch that is the selected branch head
          {
            echo "| | |"
            echo "|---|---|"
            echo "| versionName | \`${VERSION}\` |"
            echo "| versionCode | \`${VERSION_CODE}\` |"
            echo "| Commit | ${commit} |"
            if [[ "$SIGNED" == "true" ]]; then
              echo "| Signing certificate (SHA-256) | \`${CERT_SHA256}\` |"
            else
              echo "| Signing | **Debug key** - release signing secrets were not configured for this build; it will not install over a release-signed build. |"
            fi
            if [[ "$CRASH_REPORTS" == "true" ]]; then
              echo "| Remote crash reporting | Opt-in, off by default (Settings > Privacy). Anonymous; R8 mapping id \`${MAPPING_UUID}\`. Crash reports are also kept on the device (Settings > Debug). |"
            else
              echo "| Remote crash reporting | Off - this build has no project to report to. Crash reports stay on the device; share them from Settings > Debug (long-press the version row). |"
            fi
            if [[ "$CI_PROOF" == "none" ]]; then
              echo "| CI | lint and the unit tests ran in this release run |"
            else
              echo "| CI | ${CI_PROOF} |"
            fi
            echo
            echo "**Install:** download \`cursor-for-android-${VERSION}.apk\`, then \`adb install -r cursor-for-android-${VERSION}.apk\` (or open it on the device). \`SHA256SUMS.txt\` holds the checksums of the APK and AAB; \`*-mapping.txt\` is the R8 mapping for de-obfuscating stack traces."
            echo
          } > "$RUNNER_TEMP/release-body.md"
          cat "$RUNNER_TEMP/release-body.md"

      - name: Upload artifacts to this run
        uses: actions/upload-artifact@v7
        with:
          name: cursor-for-android-${{ needs.gate.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      # The last gate before the APK becomes the "latest" download. The artifacts are already attached to this run, so
      # a failure here still leaves the build to inspect - it just does not become a release.
      - name: Verify the release certificate
        env:
          SIGNED: ${{ steps.signing.outputs.configured }}
          CERT_SHA256: ${{ steps.package.outputs.cert_sha256 }}
          PINNED_CERT: ${{ steps.package.outputs.pinned_cert }}
          EXPECTED_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 || secrets.RELEASE_CERT_SHA256 }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          normalize() { local value="${1//:/}"; tr 'A-Z' 'a-z' <<< "$value"; }
          if [[ "$DRY_RUN" != "true" && "$SIGNED" != "true" ]]; then
            echo "::error::Refusing to publish a release that was not signed with the production keystore."
            exit 1
          fi
          if [[ "$SIGNED" == "true" ]]; then
            if [[ -z "$CERT_SHA256" ]]; then
              echo "::error::apksigner verified the APK but reported no signer certificate; the release identity cannot be confirmed."
              exit 1
            fi
            # The app this release installs will only accept a later APK signed with the certificate it baked in, so
            # the two have to be the same certificate. They come from one keystore, and a difference means they did not.
            if [[ "$(normalize "$CERT_SHA256")" != "$(normalize "$PINNED_CERT")" ]]; then
              echo "::error::The APK is signed with $(normalize "$CERT_SHA256"), but the build pinned $(normalize "${PINNED_CERT:-nothing}") into BuildConfig.RELEASE_CERT_SHA256 as the certificate its updater trusts."
              exit 1
            fi
            if [[ -n "$EXPECTED_CERT_SHA256" ]]; then
              actual="$(normalize "$CERT_SHA256")"
              expected="$(normalize "$EXPECTED_CERT_SHA256")"
              if [[ "$actual" != "$expected" ]]; then
                echo "::error::The APK is signed with ${actual}, but RELEASE_CERT_SHA256 pins ${expected}. The wrong keystore would end in-app updates for every existing install."
                exit 1
              fi
              echo "Signer matches RELEASE_CERT_SHA256 (${actual})."
            else
              echo "::notice::Signed with ${CERT_SHA256}. Set the RELEASE_CERT_SHA256 repository variable to this value to pin it for future releases."
            fi
          fi

      - name: Publish GitHub Release
        if: ${{ !inputs.dry_run && steps.signing.outputs.configured == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: ${{ runner.temp }}/release-body.md
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ needs.gate.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.gate.outputs.prerelease == 'false' }}
