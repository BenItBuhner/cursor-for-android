name: Release

# Pushing a tag such as v0.2.0 (or v0.2.0-rc.1 for a pre-release) builds a signed release APK + AAB from that tag and
# publishes them as a GitHub Release with auto-generated notes. The version comes from the tag alone:
#   versionName = tag without the leading "v", versionCode derived in app/build.gradle.kts.
#
# Signing uses these repository secrets (create them with scripts/release-keystore.sh):
#   RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
# All four are required to publish: a runner without them would sign with a throwaway debug key, which no later
# release can reproduce, so anyone who installed it could never be updated in place again. Optionally pin the
# expected signer with the RELEASE_CERT_SHA256 repository variable (or secret) - the workflow then refuses to publish
# an APK signed with anything else.
#
# "Run workflow" (workflow_dispatch) rebuilds an existing tag, e.g. after adding the signing secrets; tick "dry run"
# to only attach the artifacts to the workflow run. A dry run is the only case where debug signing is allowed, and
# it never touches the GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v0.2.0
        required: true
        type: string
      dry_run:
        description: Dry run - build and upload artifacts to this run only, do not create or update the GitHub Release
        type: boolean
        default: false

permissions:
  contents: write # create the release and upload its assets

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash # -eo pipefail, so a failing command inside a pipeline fails the step

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # Only used by Gradle when RELEASE_KEYSTORE_FILE is set (see the "Prepare signing" step).
  RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
  RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
  RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

jobs:
  release:
    name: Release ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate tag
        id: tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' must look like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          version="${TAG#v}"
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "Building ${version} (pre-release: ${prerelease})"

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: ./.github/actions/android-toolchain

      # The tag's version is passed here too, so AppVersionTest's parity check covers the version being released.
      - name: Lint and unit tests
        run: >
          ./gradlew :app:lintDebug :app:testDebugUnitTest -Papp.skipScreenshotTests=true
          -Papp.versionName="${{ steps.tag.outputs.version }}"

      # Every secret is required, not just the keystore: a partially configured signing config would fall back to the
      # debug key just as silently. Missing any of them stops the run here unless this is a dry run.
      - name: Prepare signing
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          missing=()
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -eq 0 ]]; then
            keystore="$RUNNER_TEMP/release.jks"
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            [[ -s "$keystore" ]] || { echo "::error::RELEASE_KEYSTORE_BASE64 did not decode into a keystore."; exit 1; }
            echo "RELEASE_KEYSTORE_FILE=${keystore}" >> "$GITHUB_ENV"
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Signing with the release keystore."
          elif [[ "$DRY_RUN" == "true" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${missing[*]} not set; this dry run's artifacts will be signed with the debug key and cannot be published."
          else
            echo "::error::${missing[*]} not set. A published release has to carry the production key, or it can never be an in-place update for anyone who installs it. Run scripts/release-keystore.sh --set-secrets, then re-run this workflow for the tag; tick 'dry run' to build debug-signed artifacts instead."
            exit 1
          fi

      - name: Build release APK and AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease -Papp.versionName="${{ steps.tag.outputs.version }}"

      - name: Package artifacts
        id: package
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          version_code="$(./gradlew -q :app:printAppVersion -Papp.versionName="$VERSION" | sed -n 's/^versionCode=//p')"
          [[ -n "$version_code" ]] || { echo "::error::Could not resolve versionCode"; exit 1; }

          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/cursor-for-android-${VERSION}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/cursor-for-android-${VERSION}.aab"
          cp app/build/outputs/mapping/release/mapping.txt "dist/cursor-for-android-${VERSION}-mapping.txt"
          (cd dist && sha256sum -- *.apk *.aab > SHA256SUMS.txt)

          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$apksigner" verify --verbose --print-certs "dist/cursor-for-android-${VERSION}.apk" | tee "$RUNNER_TEMP/apksigner.txt"
          cert_sha256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt")"

          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=${cert_sha256}" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Write release notes header
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          VERSION_CODE: ${{ steps.package.outputs.version_code }}
          CERT_SHA256: ${{ steps.package.outputs.cert_sha256 }}
          SIGNED: ${{ steps.signing.outputs.configured }}
        run: |
          commit="$(git rev-parse HEAD)" # not GITHUB_SHA: on workflow_dispatch that is the selected branch head
          {
            echo "| | |"
            echo "|---|---|"
            echo "| versionName | \`${VERSION}\` |"
            echo "| versionCode | \`${VERSION_CODE}\` |"
            echo "| Commit | ${commit} |"
            if [[ "$SIGNED" == "true" ]]; then
              echo "| Signing certificate (SHA-256) | \`${CERT_SHA256}\` |"
            else
              echo "| Signing | **Debug key** - release signing secrets were not configured for this build; it will not install over a release-signed build. |"
            fi
            echo
            echo "**Install:** download \`cursor-for-android-${VERSION}.apk\`, then \`adb install -r cursor-for-android-${VERSION}.apk\` (or open it on the device). \`SHA256SUMS.txt\` holds the checksums of the APK and AAB; \`*-mapping.txt\` is the R8 mapping for de-obfuscating stack traces."
            echo
          } > "$RUNNER_TEMP/release-body.md"
          cat "$RUNNER_TEMP/release-body.md"

      - name: Upload artifacts to this run
        uses: actions/upload-artifact@v7
        with:
          name: cursor-for-android-${{ steps.tag.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      # The last gate before the APK becomes the "latest" download. The artifacts are already attached to this run, so
      # a failure here still leaves the build to inspect - it just does not become a release.
      - name: Verify the release certificate
        env:
          SIGNED: ${{ steps.signing.outputs.configured }}
          CERT_SHA256: ${{ steps.package.outputs.cert_sha256 }}
          EXPECTED_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 || secrets.RELEASE_CERT_SHA256 }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          normalize() { local value="${1//:/}"; tr 'A-Z' 'a-z' <<< "$value"; }
          if [[ "$DRY_RUN" != "true" && "$SIGNED" != "true" ]]; then
            echo "::error::Refusing to publish a release that was not signed with the production keystore."
            exit 1
          fi
          if [[ "$SIGNED" == "true" ]]; then
            if [[ -z "$CERT_SHA256" ]]; then
              echo "::error::apksigner verified the APK but reported no signer certificate; the release identity cannot be confirmed."
              exit 1
            fi
            if [[ -n "$EXPECTED_CERT_SHA256" ]]; then
              actual="$(normalize "$CERT_SHA256")"
              expected="$(normalize "$EXPECTED_CERT_SHA256")"
              if [[ "$actual" != "$expected" ]]; then
                echo "::error::The APK is signed with ${actual}, but RELEASE_CERT_SHA256 pins ${expected}. The wrong keystore would end in-app updates for every existing install."
                exit 1
              fi
              echo "Signer matches RELEASE_CERT_SHA256 (${actual})."
            else
              echo "::notice::Signed with ${CERT_SHA256}. Set the RELEASE_CERT_SHA256 repository variable to this value to pin it for future releases."
            fi
          fi

      - name: Publish GitHub Release
        if: ${{ !inputs.dry_run && steps.signing.outputs.configured == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: ${{ runner.temp }}/release-body.md
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.tag.outputs.prerelease == 'false' }}
