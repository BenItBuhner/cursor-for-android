// Types the Compose compiler treats as stable, so composables taking them skip when the new value equals the old one
// (by default, with strong skipping, a type it cannot prove stable is compared by identity). The list rebuilds its
// rows - AgentRow, Agent, ListPreferences, LocalAgentState, ModelOption... - on every emission, equal to the last
// unless something a row shows changed; compared by identity, every row re-ran on every emission.
//
// What is listed must stay immutable, or keep identity equality:
//   * every data class in domain holds only vals and derives its lazies from them, so its equals covers all it has;
//     the two with a byte array (RepoFile, FileBytes.Plain) compare it by content;
//   * the plain classes there - PromptFile, PromptImage, MediaRef.Inline with their arrays, and the ones that hold
//     state (PendingWork, RefreshStats, ShownMessages, TranscriptPerf, TranscriptPresenter) - compare by identity,
//     which is what Compose did with them anyway.
// A data class with a var, a mutable collection, or state its equals ignores does not belong in domain.
com.cursorforandroid.domain.**
